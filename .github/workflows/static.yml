<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대면출석수업 안내 — 유비온</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B3E; --blue:#1A6FFF; --blue-lt:#EBF4FF; --blue-dk:#0050CC;
  --ink:#1A1A2E; --ink2:#5A6070; --line:#E4E8F0; --bg:#F6F8FC; --white:#FFFFFF;
  --amber:#E07B00;
}
*{box-sizing:border-box;margin:0;padding:0;word-break:keep-all;overflow-wrap:break-word;}
html,body{background:var(--bg);color:var(--ink);font-family:'Nanum Gothic',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;}
body{padding-bottom:20px;}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;}
.page{display:none;}.page.active{display:block;}

/* 홈 상단바 */
.home-bar{background:var(--navy);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
.home-bar-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.6);}
.home-bar-badge{background:var(--blue);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;}

/* 홈 히어로 */
.home-hero{background:var(--navy);padding:24px 20px 28px;color:#fff;}
.home-hero h1{font-size:24px;font-weight:800;line-height:1.4;margin-bottom:8px;}
.home-hero h1 span{color:#4A9EFF;}
.home-hero p{font-size:14px;color:rgba(255,255,255,.6);}

/* 홈 메뉴 카드 */
.menu-wrap{padding:16px;display:flex;flex-direction:column;gap:10px;}
.menu-card{background:var(--white);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;border:1.5px solid var(--line);-webkit-tap-highlight-color:transparent;width:100%;text-align:left;font-family:'Nanum Gothic',sans-serif;transition:border-color .12s,background .12s;}
.menu-card:active{border-color:var(--blue);background:var(--blue-lt);}
.menu-card.featured{border-color:var(--blue);background:var(--blue-lt);}
.menu-badge{width:48px;height:48px;border-radius:14px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.menu-card.featured .menu-badge{background:var(--blue);}
.menu-info{flex:1;}
.menu-name{font-size:17px;font-weight:800;color:var(--ink);display:block;margin-bottom:3px;}
.menu-card.featured .menu-name{color:var(--blue-dk);}
.menu-desc{font-size:13px;color:var(--ink2);}
.menu-chevron{font-size:22px;color:var(--line);font-weight:400;flex-shrink:0;}
.menu-card.featured .menu-chevron{color:var(--blue);}

/* 서브 상단바 */
.sub-bar{background:var(--navy);padding:0 16px;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:100;}
.sub-bar::-webkit-scrollbar{display:none;}
.sub-back{background:none;border:none;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:'Nanum Gothic',sans-serif;padding:16px 12px 16px 4px;white-space:nowrap;flex-shrink:0;}
.sub-divider{color:rgba(255,255,255,.3);flex-shrink:0;font-size:18px;}
.sub-nav{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;color:rgba(255,255,255,.8);font-size:12px;font-weight:700;cursor:pointer;font-family:'Nanum Gothic',sans-serif;padding:6px 12px;white-space:nowrap;flex-shrink:0;margin:8px 2px;}
.sub-nav:active{background:rgba(255,255,255,.25);color:#fff;}

/* 서브 히어로 */
.sub-hero{background:var(--navy);padding:20px 20px 24px;color:#fff;}
.sub-hero .eyebrow{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px;}
.sub-hero h2{font-size:22px;font-weight:800;line-height:1.35;}
.sub-hero p{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px;}

/* 콘텐츠 */
.content{padding:16px;display:flex;flex-direction:column;gap:12px;}

/* 정보 카드 */
.info-card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.info-row{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;}
.info-row+.info-row{border-top:1px solid var(--line);}
.row-icon{width:38px;height:38px;border-radius:10px;background:var(--blue-lt);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.row-title{font-size:15px;font-weight:800;display:block;margin-bottom:4px;}
.row-body{font-size:14px;color:var(--ink2);line-height:1.7;}
.row-body strong{color:var(--ink);font-weight:800;}
.row-body .bullet{display:block;padding-left:12px;position:relative;}
.row-body .bullet::before{content:"•";position:absolute;left:0;color:var(--blue);}
.path-details summary{font-size:15px;font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.path-details summary::-webkit-details-marker{display:none;}
.path-arrow{font-size:12px;color:var(--ink2);transition:transform .2s;}
.path-details[open] .path-arrow{transform:rotate(180deg);}
.path-details .path-box{margin-top:8px;}
.path-box{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.9;margin-top:8px;}
.pnum{color:var(--blue-dk);font-weight:800;}

/* 경고 카드 */
.warn-card{background:#FFF8ED;border:1.5px solid #FFB300;border-radius:14px;padding:16px 18px;font-size:14px;color:#6B4000;line-height:1.7;}
.warn-card strong{font-weight:800;color:#C75000;}
.danger-card{background:#FFF0F0;border:1.5px solid #FF6B6B;border-radius:14px;padding:16px 18px;font-size:14px;color:#6B0000;line-height:1.7;}
.danger-card strong{font-weight:800;}

/* 수업주차 표 */
.week-table{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.week-table table{width:100%;border-collapse:collapse;}
.week-table thead tr{background:var(--navy);}
.week-table thead th{color:#fff;font-size:13px;font-weight:700;padding:11px 14px;text-align:left;}
.week-table tbody tr+tr{border-top:1px solid var(--line);}
.week-table tbody tr:nth-child(even){background:var(--bg);}
.week-table td{padding:12px 14px;font-size:14px;}
.week-table .wk{color:var(--blue-dk);font-weight:800;}
.week-note{font-size:12px;color:var(--ink2);background:var(--bg);padding:11px 14px;border-top:1px solid var(--line);}

/* FAQ */
.faq-search-wrap{background:var(--white);border-bottom:1px solid var(--line);padding:12px 16px 8px;}
.faq-search-box{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;transition:border-color .15s;}
.faq-search-box:focus-within{border-color:var(--blue);}
.faq-search-box input{flex:1;border:none;background:transparent;font-size:15px;color:var(--ink);font-family:'Nanum Gothic',sans-serif;outline:none;}
.faq-search-box input::placeholder{color:var(--ink2);}
.faq-search-clear{background:none;border:none;color:var(--ink2);font-size:14px;cursor:pointer;padding:0;}
.faq-empty{font-size:13px;color:var(--ink2);text-align:center;padding:10px 0 4px;}
.faq-chips{display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--line);}
.chip{background:var(--bg);border:1.5px solid var(--line);color:var(--ink2);font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Nanum Gothic',sans-serif;}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.faq-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.faq-item{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.faq-item.hidden{display:none;}
details.faq-item summary{list-style:none;}
details.faq-item summary::-webkit-details-marker{display:none;}
.faq-q{display:flex;align-items:flex-start;gap:10px;padding:15px 16px;cursor:pointer;}
.q-badge{background:var(--blue-lt);color:var(--blue-dk);font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;flex-shrink:0;margin-top:2px;white-space:nowrap;}
.q-text{font-size:15px;font-weight:700;flex:1;line-height:1.5;}
.q-arrow{font-size:12px;color:var(--ink2);flex-shrink:0;margin-top:4px;transition:transform .2s;}
details.faq-item[open] .q-arrow{transform:rotate(180deg);}
.faq-a{padding:13px 16px 16px;font-size:14px;color:var(--ink2);line-height:1.75;border-top:1px solid var(--line);}
.em{font-weight:800;color:#C00;background:#FFF3B0;border-radius:3px;padding:0 3px;}
.highlight{background:#FFF3B0;border-radius:2px;}

/* 교육장 */
.venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.venue-btn{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font-family:'Nanum Gothic',sans-serif;transition:border-color .12s;width:100%;}
.venue-btn:active{border-color:var(--blue);background:var(--blue-lt);}
.region-pill{background:var(--navy);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:6px;display:inline-block;}
.venue-nm{font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;}
.venue-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;}
.venue-card.my-venue{border-color:var(--blue);}
.venue-card-head{display:flex;align-items:center;gap:10px;padding:16px 18px;cursor:pointer;}
.venue-card-head .vname{font-size:15px;font-weight:700;flex:1;}
.my-label{background:var(--blue-lt);color:var(--blue-dk);font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;}
.venue-card-body{display:none;padding:0 18px 18px;font-size:14px;color:var(--ink2);line-height:1.75;border-top:1px solid var(--line);padding-top:14px;}
.venue-card.open .venue-card-body{display:block;}
.venue-card-arrow{font-size:13px;color:var(--ink2);transition:transform .2s;flex-shrink:0;}
.venue-card.open .venue-card-arrow{transform:rotate(180deg);}
.map-btns{display:flex;gap:8px;margin-top:12px;}
.map-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:12px;border-radius:10px;}
.map-btn.kakao{background:#FAE100;color:#3A1D1D;}
.change-btn{width:100%;background:none;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:'Nanum Gothic',sans-serif;margin-top:4px;}
.venue-notice{background:#FFF8ED;border:1px solid #FFD54F;border-radius:12px;padding:12px 14px;font-size:13px;color:#6B4000;line-height:1.65;}
.venue-picker{display:flex;flex-direction:column;gap:12px;}

/* 문의 */
.contact-warn{background:#FFF8ED;border:1px solid #FFD54F;border-radius:12px;padding:14px 16px;font-size:14px;color:#6B4000;line-height:1.75;}
.contact-warn strong{font-weight:800;}
.contact-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.contact-card .c-label{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px;}
.contact-card .c-value{font-size:15px;font-weight:800;}
.contact-card .c-sub{font-size:13px;color:var(--ink2);margin-top:2px;}
.contact-row{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink);}
.contact-row:active{background:var(--blue-lt);}
.c-icon{font-size:20px;flex-shrink:0;}
.c-text{flex:1;font-size:15px;font-weight:700;}
.c-arr{font-size:18px;color:var(--line);font-weight:800;}
.email-section{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
.email-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.email-addr{font-size:13px;font-weight:700;color:var(--ink2);}
.email-copy-btn{background:var(--blue-lt);border:1px solid var(--blue);color:var(--blue-dk);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;cursor:pointer;font-family:'Nanum Gothic',sans-serif;}
.email-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.email-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 8px;text-decoration:none;font-size:13px;font-weight:700;color:var(--ink);}
.email-logo{width:30px;height:30px;border-radius:8px;background:#03C75A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;font-family:'Arial',sans-serif;}
.email-logo.g{background:#EA4335;}.email-logo.d{background:#FF5A37;}
</style>
</head>
<body>
<div class="wrap">

<!-- 홈 -->
<div class="page active" id="page-home">
  <div class="home-bar">
    <span class="home-bar-title">보육교사 2급과정 대면출석수업 안내</span>
    <span class="home-bar-badge">UBION</span>
  </div>
  <div class="home-hero">
    <h1>어떤 내용이<br><span>궁금하세요?</span></h1>
    <p>아래 5개 항목에서 확인하세요 ↓</p>
  </div>
  <div class="menu-wrap">
    <button class="menu-card featured" onclick="goPage('page-venue')">
      <div class="menu-badge">📍</div>
      <div class="menu-info"><span class="menu-name">교육장</span><span class="menu-desc">주소·지도 바로 확인</span></div>
      <span class="menu-chevron">›</span>
    </button>
    <button class="menu-card" onclick="goPage('page-schedule')">
      <div class="menu-badge">📌</div>
      <div class="menu-info"><span class="menu-name">수업 전 필독</span><span class="menu-desc">일정·시간·주의사항</span></div>
      <span class="menu-chevron">›</span>
    </button>
    <button class="menu-card" onclick="goPage('page-exam')">
      <div class="menu-badge">📝</div>
      <div class="menu-info"><span class="menu-name">출석시험 안내</span><span class="menu-desc">O/X 10문제 · 배점 10%</span></div>
      <span class="menu-chevron">›</span>
    </button>
    <button class="menu-card" onclick="goPage('page-faq')">
      <div class="menu-badge">💬</div>
      <div class="menu-info"><span class="menu-name">자주 묻는 질문</span><span class="menu-desc">궁금한 점 바로 찾기</span></div>
      <span class="menu-chevron">›</span>
    </button>
    <button class="menu-card" onclick="goPage('page-contact')">
      <div class="menu-badge">📞</div>
      <div class="menu-info"><span class="menu-name">문의하기</span><span class="menu-desc">전화·카카오·이메일</span></div>
      <span class="menu-chevron">›</span>
    </button>
  </div>
</div>

<!-- 교육장 -->
<div class="page" id="page-venue">
  <div class="sub-bar">
    <button class="sub-back" onclick="goHome()">← 처음으로</button>
    <span class="sub-divider">|</span>
    <button class="sub-nav" onclick="goPage('page-schedule')">수업 전 필독</button>
    <button class="sub-nav" onclick="goPage('page-exam')">출석시험</button>
    <button class="sub-nav" onclick="goPage('page-faq')">자주 묻는 질문</button>
    <button class="sub-nav" onclick="goPage('page-contact')">문의</button>
  </div>
  <div class="sub-hero">
    <div class="eyebrow">26년 9월 17일 개강반</div>
    <h2>교육장 안내</h2>
    <p>신청한 교육장을 선택해서 장소를 확인하세요</p>
  </div>
  <div class="content">
    <div class="venue-picker" id="venue-picker">
      <div class="venue-grid">
        <button class="venue-btn" data-venue="구로" onclick="selectVenue('구로')"><span class="region-pill">구로</span><span class="venue-nm">본사 지하 세미나실</span></button>
        <button class="venue-btn" data-venue="강북" onclick="selectVenue('강북')"><span class="region-pill">강북</span><span class="venue-nm">정화예술대학교</span></button>
        <button class="venue-btn" data-venue="인천" onclick="selectVenue('인천')"><span class="region-pill">인천</span><span class="venue-nm">건설기술교육원</span></button>
        <button class="venue-btn" data-venue="수원" onclick="selectVenue('수원')"><span class="region-pill">수원</span><span class="venue-nm">수원뷰티실용전문학교</span></button>
        <button class="venue-btn" data-venue="대전" onclick="selectVenue('대전')"><span class="region-pill">대전</span><span class="venue-nm">대전우송정보대학교</span></button>
        <button class="venue-btn" data-venue="광주" onclick="selectVenue('광주')"><span class="region-pill">광주</span><span class="venue-nm">한국예술종합교육원</span></button>
        <button class="venue-btn" data-venue="대구" onclick="selectVenue('대구')"><span class="region-pill">대구</span><span class="venue-nm">계명문화대학교</span></button>
        <button class="venue-btn" data-venue="부산" onclick="selectVenue('부산')"><span class="region-pill">부산</span><span class="venue-nm">화신사이버대학교</span></button>
      </div>
    </div>
    <div id="venue-detail" style="display:none;flex-direction:column;gap:12px;">
      <div class="venue-notice">강의실은 사정에 따라 변경될 수 있습니다. 변경 시 별도 공지됩니다.</div>
      <div class="venue-card my-venue" id="my-venue-card"></div>
      <button class="change-btn" onclick="resetVenue()">⟳ 교육장 다시 선택하기</button>
    </div>
  </div>
</div>

<!-- 수업 전 필독 -->
<div class="page" id="page-schedule">
  <div class="sub-bar">
    <button class="sub-back" onclick="goHome()">← 처음으로</button>
    <span class="sub-divider">|</span>
    <button class="sub-nav" onclick="goPage('page-venue')">교육장</button>
    <button class="sub-nav" onclick="goPage('page-exam')">출석시험</button>
    <button class="sub-nav" onclick="goPage('page-faq')">자주 묻는 질문</button>
    <button class="sub-nav" onclick="goPage('page-contact')">문의</button>
  </div>
  <div class="sub-hero">
    <div class="eyebrow">📌 수업 전 필독</div>
    <h2>수업 전 꼭 확인하세요!</h2>
    <p>놓치면 미이수가 될 수 있어요</p>
  </div>
  <div class="content">
    <div class="info-card">
      <div class="info-row">
        <div class="row-icon">🕘</div>
        <div><span class="row-title">수업시간</span><span class="row-body">오전 9시 ~ 오후 6시 (8교시)</span></div>
      </div>
      <div class="info-row">
        <div class="row-icon">🚪</div>
        <div><span class="row-title">입실 가능 시간</span><span class="row-body">오전 8시 30분 이후부터 가능</span></div>
      </div>
      <div class="info-row">
        <div class="row-icon">🍱</div>
        <div><span class="row-title">쉬는시간·점심시간</span><span class="row-body">당일 담당 교수님 공지 (수업마다 상이)</span></div>
      </div>
      <div class="info-row">
        <div class="row-icon">📋</div>
        <div style="flex:1;">
          <details class="path-details">
            <summary>내 일정·교육장 확인 <span class="path-arrow">▾</span></summary>
            <div class="path-box">
              <span class="pnum">①</span> 홈페이지 › 나의 강의실 › 대면/실습<br>&emsp;› 대면수업 학습현황 › 해당과목 <strong>"보기"</strong><br><br>
