<script>
const VENUE_KEY = 'ubion_venue_v8';

function goPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  history.pushState({page:id}, '', '#'+id.replace('page-',''));
  window.scrollTo({top:0, behavior:'instant'});
}
function goHome() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-home').classList.add('active');
  history.pushState({page:'page-home'}, '', ' ');
  window.scrollTo({top:0, behavior:'instant'});
}
// 뒤로가기: GitHub 배포 시 작동
window.addEventListener('popstate', e => {
  const id = (e.state && e.state.page) || 'page-home';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
});

const venueNames = {'구로':'본사 지하 세미나실','강북':'정화예술대학교 외식산업관','인천':'건설기술교육원','수원':'수원뷰티실용전문학교','대전':'대전우송정보대학교 동캠퍼스','광주':'한국예술종합교육원','대구':'계명문화대학교 평생교육원','부산':'화신사이버대학교 평생교육원'};
const venueAddr = {'구로':['서울 구로구 디지털로 34길 27 대륭포스트타워 3차 지하1층','지하 세미나실','https://map.naver.com/p/search/서울특별시%20구로구%20디지털로34길%2027%20대륭포스트타워3차','https://map.kakao.com/?q=서울특별시%20구로구%20디지털로34길%2027%20대륭포스트타워3차'],'강북':['서울 중구 소공로3길 26','106호 강의실','https://map.naver.com/p/search/서울%20중구%20소공로3길%2026','https://map.kakao.com/?q=서울%20중구%20소공로3길%2026'],'인천':['인천 남동구 소래로 688 건설기술교육원 별관','1층 6호관','https://map.naver.com/p/search/인천광역시%20남동구%20소래로%20688','https://map.kakao.com/?q=인천광역시%20남동구%20소래로%20688'],'수원':['경기도 수원시 영통구 반달로7번길 16','3층 강의실','https://map.naver.com/p/search/경기도%20수원시%20영통구%20반달로7번길%2016','https://map.kakao.com/?q=경기도%20수원시%20영통구%20반달로7번길%2016'],'대전':['대전 동구 백룡로 59 동캠퍼스','추후 안내','https://map.naver.com/p/search/대전광역시%20동구%20백룡로%2059','https://map.kakao.com/?q=대전광역시%20동구%20백룡로%2059'],'광주':['광주 동구 서석로 89','4층 강의실','https://map.naver.com/p/search/광주광역시%20동구%20서석로%2089','https://map.kakao.com/?q=광주광역시%20동구%20서석로%2089'],'대구':['대구 달서구 달서대로 675','보건관 또는 쇠턱관 강의실','https://map.naver.com/p/search/대구광역시%20달서구%20달서대로%20675','https://map.kakao.com/?q=대구광역시%20달서구%20달서대로%20675'],'부산':['부산 연제구 고분로191번길 1','3층 다목적홀','https://map.naver.com/p/search/부산광역시%20연제구%20고분로191번길%201','https://map.kakao.com/?q=부산광역시%20연제구%20고분로191번길%201']};

function selectVenue(venue) {
  try { localStorage.setItem(VENUE_KEY, venue); } catch(e) {}
  showVenueDetail(venue);
}
function showVenueDetail(venue) {
  document.getElementById('venue-picker').style.display = 'none';
  const d = venueAddr[venue];
  document.getElementById('my-venue-card').innerHTML =
    '<div class="venue-card-head"><span class="region-pill">'+venue+'</span><span style="font-size:15px;font-weight:800;flex:1;margin-left:8px;">'+venueNames[venue]+'</span><span class="my-label">내 교육장</span></div>' +
    '<div class="venue-card-body" style="display:block;">'+d[0]+'<br>강의실 : <strong>'+d[1]+'</strong>' +
    '<div class="map-btns"><a class="map-btn" href="'+d[2]+'" target="_blank" rel="noopener">🗺️ 네이버지도</a><a class="map-btn kakao" href="'+d[3]+'" target="_blank" rel="noopener">🟡 카카오맵</a></div></div>';
  const det = document.getElementById('venue-detail');
  det.style.display = 'flex';
  det.style.flexDirection = 'column';
  det.style.gap = '12px';
}
function resetVenue() {
  try { localStorage.removeItem(VENUE_KEY); } catch(e) {}
  document.getElementById('venue-picker').style.display = 'flex';
  document.getElementById('venue-detail').style.display = 'none';
}
(function() { try { const s = localStorage.getItem(VENUE_KEY); if(s) showVenueDetail(s); } catch(e) {} })();

function filterFaq(keyword) {
  const kw = keyword.trim();
  const items = document.querySelectorAll('#page-faq .faq-item');
  const clearBtn = document.getElementById('faqClearBtn');
  const empty = document.getElementById('faqEmpty');
  const chips = document.getElementById('faqChips');
  clearBtn.style.display = kw ? 'block' : 'none';
  chips.style.display = kw ? 'none' : 'flex';
  let found = 0;
  items.forEach(item => {
    const qEl = item.querySelector('.q-text');
    const aEl = item.querySelector('.faq-a');
    if (!qEl || !aEl) return;
    if (!qEl.dataset.orig) qEl.dataset.orig = qEl.textContent.trim();
    const hasTable = aEl.querySelector('table');
    if (!aEl.dataset.orig) { aEl.dataset.orig = hasTable ? aEl.innerHTML : aEl.textContent.trim(); aEl.dataset.hasTable = hasTable ? '1' : '0'; }
    const qOrig = qEl.dataset.orig, aOrig = aEl.dataset.orig, isTable = aEl.dataset.hasTable === '1';
    if (!kw) { item.classList.remove('hidden'); item.removeAttribute('open'); qEl.textContent = qOrig; isTable ? aEl.innerHTML = aOrig : aEl.textContent = aOrig; return; }
    const searchText = isTable ? qOrig : (qOrig + ' ' + aOrig);
    if (searchText.includes(kw)) {
      item.classList.remove('hidden'); item.setAttribute('open','');
      const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const hl = t => t.replace(new RegExp(esc,'g'),'<mark class="highlight">'+kw+'</mark>');
      qEl.innerHTML = hl(qOrig);
      if (!isTable) aEl.innerHTML = hl(aOrig); else aEl.innerHTML = aOrig;
      found++;
    } else { item.classList.add('hidden'); item.removeAttribute('open'); qEl.textContent = qOrig; isTable ? aEl.innerHTML = aOrig : aEl.textContent = aOrig; }
  });
  empty.style.display = (kw && found === 0) ? 'block' : 'none';
}
function clearFaq() { const i = document.getElementById('faqSearchInput'); i.value=''; filterFaq(''); i.focus(); }
document.querySelectorAll('#faqChips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#faqChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const cat = chip.dataset.cat;
    document.querySelectorAll('#page-faq .faq-item').forEach(item => {
      item.classList.toggle('hidden', cat !== 'all' && item.dataset.cat !== cat);
    });
  });
});
function copyEmail(btn) {
  navigator.clipboard.writeText('practice@ubion.co.kr').then(() => {
    btn.textContent = '복사됨 ✓'; btn.style.background = 'var(--navy)'; btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = '복사'; btn.style.background=''; btn.style.color=''; }, 2000);
  });
}
</script>
